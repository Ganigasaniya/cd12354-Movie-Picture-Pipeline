name: Backend Continuous Deployment
"on":
  push:
    branches: [main]
    paths: ['starter/backend/**']
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          cd starter/backend
          pip install pipenv
          pipenv install --dev
          pipenv run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          cd starter/backend
          pip install pipenv
          pipenv install --dev
          pipenv run test
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build Push Deploy
        run: |
          cd starter/backend
          docker build -t ${{ secrets.AWS_ECR_BACKEND }}:${{ github.sha }}.
          docker push ${{ secrets.AWS_ECR_BACKEND }}:${{ github.sha }}
          cd../../setup/k8s/backend
          kustomize edit set image backend=${{ secrets.AWS_ECR_BACKEND }}:${{ github.sha }}
          kustomize build | kubectl apply -f -
