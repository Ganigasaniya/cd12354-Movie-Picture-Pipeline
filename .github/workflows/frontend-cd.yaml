name: Frontend Continuous Deployment
"on":
  push:
    branches: [main]
    paths: ['starter/frontend/**']
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: |
          cd starter/frontend
          npm install
          npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: |
          cd starter/frontend
          npm install
          npm run test
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build Push Deploy
        run: |
          cd starter/frontend
          docker build -t ${{ secrets.AWS_ECR_FRONTEND }}:${{ github.sha }}.
          docker push ${{ secrets.AWS_ECR_FRONTEND }}:${{ github.sha }}
          cd../../setup/k8s/frontend
          kustomize edit set image frontend=${{ secrets.AWS_ECR_FRONTEND }}:${{ github.sha }}
          kustomize build | kubectl apply -f -
